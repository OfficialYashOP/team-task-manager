<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Team Task Manager - Create projects, assign tasks, and track progress with your team.">
  <title>TaskFlow — Team Task Manager</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-bg"></div>

    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-logo">
          <h1>⚡ TaskFlow</h1>
          <p>Manage projects. Assign tasks. Ship faster.</p>
        </div>

        <div class="auth-tabs">
          <button class="auth-tab active" id="loginTab">Sign In</button>
          <button class="auth-tab" id="signupTab">Sign Up</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm">
          <div class="form-group">
            <label for="loginEmail">Email address</label>
            <input type="email" class="form-control" id="loginEmail" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" required>
          </div>
          <button type="submit" class="btn btn-primary btn-full">Sign In</button>
        </form>

        <!-- Signup Form -->
        <form id="signupForm" style="display: none;">
          <div class="form-group">
            <label for="signupName">Full name</label>
            <input type="text" class="form-control" id="signupName" placeholder="John Doe" required minlength="2">
          </div>
          <div class="form-group">
            <label for="signupEmail">Email address</label>
            <input type="email" class="form-control" id="signupEmail" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="signupPassword">Password</label>
            <input type="password" class="form-control" id="signupPassword" placeholder="At least 6 characters" required minlength="6">
          </div>
          <button type="submit" class="btn btn-primary btn-full">Create Account</button>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
